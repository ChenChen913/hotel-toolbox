name: Deploy to Cloudflare Pages

# 说明：
#   · 没有配置 CLOUDFLARE_API_TOKEN 时，这个工作流会**跳过**部署步骤（不会让 CI 变红）；
#   · 需要 Cloudflare 账号 ID 与一个最小权限的 API Token：
#       Permissions: Account → Cloudflare Pages → Edit
#     在仓库 Settings → Secrets and variables → Actions 里加：
#       CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
#   · GitHub Pages 仍是主入口（deploy.yml），这里是并行部署，互不影响。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Build (root base for Cloudflare Pages)
        run: npm run build:cf

      - name: Check credentials
        id: creds
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Cloudflare 未配置::缺少 CLOUDFLARE_API_TOKEN 或 CLOUDFLARE_ACCOUNT_ID，跳过部署。"
          fi

      - name: Ensure Pages project exists
        if: steps.creds.outputs.ok == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 首次部署前建好项目；已存在时这一步会报错，由 continue-on-error 兜住
          command: pages project create hotel-toolbox --production-branch=main

      - name: Deploy
        if: steps.creds.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=hotel-toolbox --branch=main
